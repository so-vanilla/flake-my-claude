projection: outcome-system-artifact/v1
qualified_id: group.C.C2
canonical_source: "{{schema}}"
display_only: true
state_owner: none
nodes:
  source: "{{output.payload.node_ids[]}}"
edges:
  - prerequisite:
      source: "{{output.payload.edges[].prerequisite}}"
    dependent:
      source: "{{output.payload.edges[].dependent}}"
joins:
  - outcome_id:
      source: "{{output.payload.joins[].outcome_id}}"
    incoming:
      source: "{{output.payload.joins[].incoming[]}}"
    owner:
      stable_id:
        source: "{{output.payload.joins[].owner_ref.stable_id}}"
      role:
        source: "{{output.payload.joins[].owner_ref.role}}"
runtime_checks:
  source: "{{output.payload.runtime_checks[]}}"
c01_bundle_ref:
  source: "{{inputs.c01_bundle_ref}}"
unknown_values: preserve
null_values: preserve
