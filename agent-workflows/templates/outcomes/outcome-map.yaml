projection: outcome-system-artifact/v1
qualified_id: group.C.C1
canonical_source: "{{schema}}"
display_only: true
state_owner: none
outcomes:
  - outcome_id:
      source: "{{output.payload.outcomes[].outcome_id}}"
    achieved_state:
      source: "{{output.payload.outcomes[].achieved_state}}"
    why_required:
      source: "{{output.payload.outcomes[].why_required}}"
    objective_contribution:
      source: "{{output.payload.outcomes[].objective_contribution[]}}"
    exclusion_conditions:
      source: "{{output.payload.outcomes[].exclusion_conditions[]}}"
    owner:
      stable_id:
        source: "{{output.payload.outcomes[].owner_ref.stable_id}}"
      role:
        source: "{{output.payload.outcomes[].owner_ref.role}}"
    acceptance_predicates:
      source: "{{output.payload.outcomes[].acceptance_predicate_refs[]}}"
coverage_refs:
  source: "{{output.payload.coverage_refs[]}}"
unknown_values: preserve
null_values: preserve
