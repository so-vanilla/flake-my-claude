projection: outcome-system-artifact/v1
qualified_id: group.C.C4
canonical_source: "{{schema}}"
display_only: true
state_owner: none
outcome_id:
  source: "{{output.payload.outcome_id}}"
target_ref:
  path:
    source: "{{output.payload.target_ref.path}}"
  version:
    source: "{{output.payload.target_ref.version}}"
  digest:
    source: "{{output.payload.target_ref.digest}}"
target:
  unit:
    source: "{{inputs.target.unit}}"
  formula:
    source: "{{inputs.target.formula}}"
  source:
    source: "{{inputs.target.source}}"
  frequency:
    source: "{{inputs.target.frequency}}"
  window:
    source: "{{inputs.target.window}}"
  guard:
    source: "{{inputs.target.guard}}"
unknown_values: preserve
null_values: preserve
